[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps = 
	sparkfun/SX1509 IO Expander@^3.0.6
	pololu/VL53L0X@^1.3.1
	pololu/VL53L1X@^1.3.1
	fastled/FastLED@^3.10.3
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit TCS34725@^1.4.4
	dfrobot/DFRobot_HX711@^1.0.0
	adafruit/Adafruit BusIO
	SPI
	Wire
	bitcraze/Bitcraze PMW3901@^1.2
	olikraus/U8g2@^2.36.18


